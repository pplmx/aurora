version: "2"

linters:
  default: none
  # errcheck is deliberately absent. Run against this tree it reports 28 sites:
  # nine fmt.Fprint* writes to an io.Writer whose failure the process cannot act
  # on (a help screen), and nineteen unchecked Close, Remove and Unsetenv calls
  # in test cleanup, where a failure means the test's own scaffolding broke and
  # the assertion that follows reports it. Enabling the linter would trade real
  # signal for noise. The gate's signal comes from vet, staticcheck, ineffassign,
  # unused, bodyclose, misspell, errorlint, nilerr, durationcheck, rowserrcheck
  # and sqlclosecheck.
  # Four more were tried against this tree and left off, each for a finding that
  # is not a defect: copyloopvar flagged two loop-variable copies that keep the
  # code readable to someone still thinking in pre-1.22 terms, wastedassign
  # flagged an initial value a switch's default branch still needs, prealloc
  # flagged two buffers whose length is not known until the call, and
  # predeclared flagged seven locals named min, max, cap or close, each of which
  # reads better than the alternative at its call site.
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  exclusions:
    rules:
      # Test files legitimately assert on values the analyzer cannot prove
      # non-nil, and the repo's helpers make SA5011 noise instead of signal.
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA5011"
