name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: pplmx/aurora
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Pull requests build both architectures but never authenticate or push:
    # fork PRs have no repository secrets, and an unreviewed image must not be
    # published under the project's registry names.
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-qemu-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          # A validation build has no local multi-arch image to run, and a
          # push build already publishes exactly these tags. Smoke-test the
          # native image separately before uploading the multi-arch result.
          load: false
          cache-from: type=gha,key=aurora-${{ github.sha }}
          cache-to: type=gha,mode=max

      - name: Build a native image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: aurora-smoke-test:${{ github.sha }}
          pull: true
          cache-from: type=gha,key=aurora-${{ github.sha }}

      - name: Smoke-test the CLI image
        env:
          # The native build is tagged with the full commit SHA. The published
          # images use metadata-action's short SHA tag.
          SMOKE_IMAGE: aurora-smoke-test:${{ github.sha }}
        run: |
          docker run --rm "$SMOKE_IMAGE" --help
