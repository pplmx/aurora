name: Release

on:
  push:
    tags:
      - 'v*'
  # A failed or interrupted tag run can be retried without re-tagging. The
  # normal path is the tag push above; listening to `release: published` as
  # well made every tag build the whole native matrix twice, because creating
  # the release from that run emits the event again.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: '1.27.3'

# Publishing replaces release files one by one. Serialize every path that can
# target the same tag (tag push and manual retries) so one complete asset set
# cannot be interleaved with another run's binaries, checksums or provenance.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # workflow_dispatch is the retry path for an interrupted tag run. It must
  # never turn an arbitrary branch or commit input into a new release tag:
  # action-gh-release would create a missing tag from the default branch,
  # pairing artifacts from one ref with a tag at another commit.
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require an existing version tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            printf 'Release ref must be a version tag such as v1.2.3; got %q\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          git fetch --force --tags origin
          if ! commit="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
            printf 'Release tag %s does not exist; create and push the tag first.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          printf 'Release tag %s resolves to %s\n' "$RELEASE_TAG" "$commit"

  build:
    uses: ./.github/workflows/build.yml
    needs: validate-tag
    permissions:
      contents: read
    secrets: inherit
    with:
      ref: ${{ inputs.tag || github.ref }}
      # Signing stays off: the repository holds no Authenticode certificate and
      # no Developer ID identity, and none is expected in the foreseeable
      # future. Both flags are fail-closed, so a release that cannot be signed
      # is better than one that claims to be. Flip a flag to true only when its
      # secrets in docs/desktop.md exist.
      require_signed_windows: false

  desktop-build:
    uses: ./.github/workflows/desktop-build.yml
    needs: validate-tag
    permissions:
      contents: read
    secrets: inherit
    with:
      ref: ${{ inputs.tag || github.ref }}
      # Same policy as the build job above: unsigned until the credentials in
      # docs/desktop.md exist.
      require_signed_macos: false
      require_signed_windows: false

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate-tag, build, desktop-build]
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      # The release body names the previous tag, so the job needs the full tag
      # list rather than the single commit the default depth-1 fetch leaves.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # The previous stub cross-build produced files whose database commands
      # failed at runtime. Read Go's own build metadata from every CLI and
      # desktop executable before publishing, then smoke-test the Linux CLI.
      - name: Verify release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          while read -r file goos goarch; do
            metadata="$(go version -m "$file")"
            grep -Fq $'\tbuild\tCGO_ENABLED=0' <<<"$metadata"
            grep -Fq $'\tbuild\tGOOS='"$goos" <<<"$metadata"
            grep -Fq $'\tbuild\tGOARCH='"$goarch" <<<"$metadata"
          done <<EOF
          artifacts/aurora-darwin-amd64/aurora-darwin-amd64 darwin amd64
          artifacts/aurora-darwin-arm64/aurora-darwin-arm64 darwin arm64
          artifacts/aurora-linux-amd64/aurora-linux-amd64 linux amd64
          artifacts/aurora-linux-arm64/aurora-linux-arm64 linux arm64
          artifacts/aurora-windows-amd64/aurora-windows-amd64.exe windows amd64
          artifacts/aurora-windows-arm64/aurora-windows-arm64.exe windows arm64
          artifacts/aurora-desktop-darwin-amd64/Aurora.app/Contents/MacOS/Aurora darwin amd64
          artifacts/aurora-desktop-darwin-arm64/Aurora.app/Contents/MacOS/Aurora darwin arm64
          artifacts/aurora-desktop-linux-amd64/aurora linux amd64
          artifacts/aurora-desktop-linux-arm64/aurora linux arm64
          artifacts/aurora-desktop-windows-amd64/Aurora.exe windows amd64
          EOF

          # upload-artifact does not preserve the executable bit. Restore it
          # before the only release artifact that this Linux job can run.
          cli="artifacts/aurora-linux-amd64/aurora-linux-amd64"
          chmod +x "$cli"
          output="$("$cli" version)"
          grep -Fq "Version: $RELEASE_VERSION" <<<"$output"
          if grep -Fq "Build Time: unknown" <<<"$output"; then
            echo "the release binary has no build timestamp" >&2
            exit 1
          fi

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          find \
            aurora-darwin-amd64 aurora-darwin-arm64 \
            aurora-linux-amd64 aurora-linux-arm64 \
            aurora-windows-amd64 aurora-windows-arm64 \
            -maxdepth 1 -type f -print0 |
            sort -z |
            xargs -0 -r sha256sum > checksums.txt
          find \
            aurora-desktop-darwin-amd64 aurora-desktop-darwin-arm64 \
            aurora-desktop-linux-amd64 aurora-desktop-linux-arm64 \
            aurora-desktop-windows-amd64 \
            -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name 'Aurora.exe' -o -iname '*setup*.exe' \) \
            -print0 |
            sort -z |
            xargs -0 -r sha256sum >> checksums.txt
          # install.sh is identical on both Linux legs but GitHub Releases
          # flatten the two names into one, so hash it once and prove the copies
          # agree before publishing the single line.
          cmp aurora-desktop-linux-amd64/install.sh \
            aurora-desktop-linux-arm64/install.sh
          sha256sum aurora-desktop-linux-amd64/install.sh >> checksums.txt
          # Six CLI binaries plus eleven desktop distributables (two DMGs, two
          # debs, two RPMs, two tarballs, install.sh, Aurora.exe and one NSIS
          # installer).
          test "$(wc -l < checksums.txt)" -eq 17
          sha256sum -c checksums.txt
          # GitHub Releases flatten assets into one directory. Drop the local
          # artifact directory from each line so a downloaded checksums.txt
          # verifies the files users actually receive.
          sed -E 's#  .*/#  #' checksums.txt > checksums.release.txt
          mv checksums.release.txt checksums.txt
          ! grep -Eq '  .*/' checksums.txt
          test -s checksums.txt

      # The checksums file now names the exact release assets, including any
      # platform signatures applied by the build jobs. Bind those final files
      # to this workflow run before publishing them.
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-checksums: artifacts/checksums.txt

      - name: Build release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          heading="## [$RELEASE_VERSION]"
          if ! grep -Fq "$heading" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $RELEASE_VERSION" >&2
            exit 1
          fi
          # The release body is the curated summary that opens the version's
          # changelog section. The thousand-odd per-commit entries below it stay
          # in CHANGELOG.md; pasting them here is what made the release page
          # unreadable.
          awk -v want="$heading" '
            index($0, want) == 1 {in_version = 1; next}
            in_version && /^## \[/ {exit}
            in_version && /^### (Highlights|Note)$/ {in_kept = 1}
            in_kept && /^### / && !/^### (Highlights|Note)$/ {exit}
            in_kept {print}
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          test -s release-notes.md
          previous="$(git describe --tags --abbrev=0 "${RELEASE_VERSION}^")"
          {
            cat release-notes.md
            printf '\nSee [CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md) for the full list of changes.\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_VERSION"
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$RELEASE_VERSION"
          } > release-body.md
          cat release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # List the distributables explicitly. `artifacts/**/*` also matched
          # files inside the macOS .app bundle, which cannot be installed on
          # their own and would collide between the two Mac builds.
          files: |
            artifacts/aurora-darwin-amd64/aurora-darwin-amd64
            artifacts/aurora-darwin-arm64/aurora-darwin-arm64
            artifacts/aurora-linux-amd64/aurora-linux-amd64
            artifacts/aurora-linux-arm64/aurora-linux-arm64
            artifacts/aurora-windows-amd64/aurora-windows-amd64.exe
            artifacts/aurora-windows-arm64/aurora-windows-arm64.exe
            artifacts/aurora-desktop-darwin-amd64/*.dmg
            artifacts/aurora-desktop-darwin-arm64/*.dmg
            artifacts/aurora-desktop-linux-amd64/*.deb
            artifacts/aurora-desktop-linux-arm64/*.deb
            artifacts/aurora-desktop-linux-amd64/*.rpm
            artifacts/aurora-desktop-linux-arm64/*.rpm
            artifacts/aurora-desktop-linux-amd64/*.tar.gz
            artifacts/aurora-desktop-linux-arm64/*.tar.gz
            artifacts/aurora-desktop-linux-amd64/install.sh
            artifacts/aurora-desktop-windows-amd64/Aurora.exe
            artifacts/aurora-desktop-windows-amd64/*setup*.exe
            artifacts/checksums.txt
          # Curated notes from CHANGELOG.md, not GitHub's generated list: that
          # list has no prose and, with no merged pull requests, was one link.
          body_path: release-body.md
          overwrite_files: true
