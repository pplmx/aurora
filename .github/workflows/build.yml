name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}

env:
  GO_VERSION: '1.26'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi
          # Inject the real version/build time so released binaries report
          # what they are instead of the 0.0.1 placeholder (TASK-206).
          # GITHUB_REF_NAME is the tag (vX.Y.Z) on a tag release, else the
          # branch name; fall back to the short SHA for straight branch runs.
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="$(git rev-parse --short HEAD)"
          fi
          BUILDTIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags="-s -w -X github.com/pplmx/aurora/cmd/aurora/cmd.Version=${VERSION} -X github.com/pplmx/aurora/cmd/aurora/cmd.BuildTime=${BUILDTIME}" -o aurora-${GOOS}-${GOARCH}${EXT} ./cmd/aurora

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aurora-${{ matrix.goos }}-${{ matrix.goarch }}
          path: aurora-*
          retention-days: 5
