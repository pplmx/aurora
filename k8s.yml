# Aurora CLI toolbox on Kubernetes.
#
# The image ships only the CLI binary (cmd/aurora) — a non-interactive run
# exits, so the image is expressed as a one-shot batch Job rather than a
# replicated service. The old Deployment opened port 6666 + Service + HPA,
# but nothing in the image listens on any port (ISS-192); those are gone here.
#
# Run it for a specific CLI invocation:
#   kubectl apply -f k8s.yml
#   kubectl create job --from=job/aurora-cli aurora-lottery-history \
#     --image=pplmx/aurora:latest -- ./aurora lottery history
#   kubectl logs job/aurora-lottery-history
#
# The Web UI is a separate binary (cmd/api), not part of this image — see
# README.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aurora-config
  namespace: aurora
data:
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aurora-data
  namespace: aurora
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aurora-cli
  namespace: aurora
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: aurora
          image: pplmx/aurora:latest
          # Default sanity command; edit or use `kubectl create job --from=...`
          # for the CLI invocation you actually need.
          command: ["./aurora", "lottery", "stats"]
          envFrom:
            - configMapRef:
                name: aurora-config
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aurora-data
