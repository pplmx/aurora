<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora - Dashboard</title>
    <script defer src="https://unpkg.com/alpinejs@3.13.5"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" x-data="dashboardApp()" x-init="init()">
        <header>
            <h1>Aurora <span class="version">Dashboard</span></h1>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/lottery.html">Lottery</a>
                <a href="/voting.html">Voting</a>
                <a href="/token.html">Token</a>
                <a href="/oracle.html">Oracle</a>
                <a href="/blockchain.html">Blockchain</a>
                <a href="/nft.html">NFT</a>
            </nav>
        </header>
        <main>
            <section class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Total Lotteries</span>
                    <span class="stat-value" x-text="stats.lotteries">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Total Votes</span>
                    <span class="stat-value" x-text="stats.votes">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Candidates</span>
                    <span class="stat-value" x-text="stats.candidates">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Voting Sessions</span>
                    <span class="stat-value" x-text="stats.sessions">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Ledger Integrity</span>
                    <span class="stat-value" x-text="stats.integrity">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Oracle Feeds</span>
                    <span class="stat-value" x-text="stats.oracle">-</span>
                </div>
            </section>
            <section class="activity">
                <h2>Recent Activity</h2>
                <div x-show="loading">Loading...</div>
                <template x-for="item in activity" :key="item.key">
                    <div class="proposal-card">
                        <h3 x-text="item.title"></h3>
                        <p class="proposal-meta" x-text="item.detail"></p>
                    </div>
                </template>
                <p x-show="!loading && activity.length === 0" class="activity-empty">No recent activity</p>
            </section>
        </main>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
