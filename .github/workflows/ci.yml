name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.27.2'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - run: go mod download

      # The desktop job below already rejects unformatted code, but the core
      # module had no such gate: commit 7a7f53d landed three unformatted Go
      # files and nothing failed until a contributor happened to run
      # `just check` locally. Formatting is checked here with the same flags
      # the justfile uses (`gofmt -s`), over this module's packages only, so a
      # newer desktop toolchain cannot make this job depend on desktop/.
      - name: Format
        run: |
          set -euo pipefail
          dirs="$(go list -f '{{.Dir}}' ./...)"
          unformatted="$(gofmt -s -l $dirs)"
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt would change:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - run: CGO_ENABLED=0 go vet ./...

      # Keep a cgo-free test run in CI; the race detector below is the only
      # gate that needs cgo.
      - name: Test (pure Go)
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Test (race)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - uses: codecov/codecov-action@v6
        if: github.event_name == 'pull_request'
        with:
          files: ./coverage.out
          flags: unittests
          name: aurora

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pin the binary: `latest` silently tracks new major releases and
          # the config schema between them is not compatible (v1 -> v2 moved
          # issues.exclude-rules), which is how lint started failing on a
          # config it used to pass.
          version: v2.15.0
          args: --timeout=5m -D errcheck

  # The desktop shell is a nested module (Go 1.27, MyGo) and `go test ./...`
  # at the root does not look inside it: without this job a broken window
  # layer - the embedded UI, the aurora:// write path, deep-link routing -
  # passed every gate silently.
  #
  # Its own toolchain is installed here from desktop/go.mod rather than
  # through GO_VERSION so the nested module keeps declaring its own minimum.
  desktop:
    name: Desktop (MyGo shell)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      # Storage is pure Go, so the desktop module builds without a C
      # toolchain. The race detector still needs cgo; see the Test step.
      - name: Format
        run: test -z "$(gofmt -l .)"
        working-directory: desktop

      - name: Build
        run: CGO_ENABLED=0 go build ./...
        working-directory: desktop

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
        working-directory: desktop

      # `just desktop-check` runs the same cgo-free gates locally.
      - name: Test (pure Go)
        run: CGO_ENABLED=0 go test -count=1 ./...
        working-directory: desktop

      # Keep the stronger race gate explicit: the detector itself needs cgo,
      # even though the desktop production build no longer does.
      - name: Test (race)
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...
        working-directory: desktop

  # The desktop job above compiles the nested module. This job also runs the
  # real MyGo packaging path, so a broken mygo.config.ts or missing artifact
  # fails CI before a release tag is created. Other platforms are packaged by
  # desktop-build.yml on native runners during release.
  desktop-package:
    name: Desktop package (Linux amd64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # mygo.config.ts runs `git describe`; the packaging gate must see
          # the tags or it tests a SHA-only version.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      # MyGo loads GTK/WebKit at runtime; Xvfb gives the packaged app a
      # display so the smoke test below exercises the real startup path.
      - name: Install desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-0 libgtk-3-0 xvfb

      - name: Package
        env:
          CGO_ENABLED: '0'
        run: go tool mygo build -platform linux/amd64 -skip-dmg
        working-directory: desktop

      - name: Verify pure-Go build metadata
        run: |
          metadata="$(go version -m dist/desktop/linux-amd64/aurora)"
          grep -Fq $'\tbuild\tCGO_ENABLED=0' <<<"$metadata"
          grep -Fq $'\tbuild\tGOOS=linux' <<<"$metadata"
          grep -Fq $'\tbuild\tGOARCH=amd64' <<<"$metadata"

      - name: Verify the packaged binary reports its build identity
        run: |
          version="$(dist/desktop/linux-amd64/aurora --version)"
          printf '%s\n' "$version"
          test "$(printf '%s\n' "$version" | sed -n 's/^Version: //p')" != "0.0.1"
          test "$(printf '%s\n' "$version" | sed -n 's/^Build Time: //p')" != "unknown"

      - name: Verify package
        run: |
          test -x dist/desktop/linux-amd64/aurora
          test -f dist/desktop/linux-amd64/aurora.desktop
          test -f dist/desktop/linux-amd64/install.sh
          test -f dist/desktop/linux-amd64/build-time.txt
          test -n "$(find dist/desktop/linux-amd64 -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find dist/desktop/linux-amd64 -maxdepth 1 -name '*.tar.gz' -print -quit)"
          grep -q 'MimeType=x-scheme-handler/aurora;' dist/desktop/linux-amd64/aurora.desktop
          test -z "$(find dist/desktop/linux-amd64 -name '*.go' -print -quit)"

      # A package can pass every file check and still die before opening its
      # window. Start the real artifact against an empty data directory and
      # require the database to appear while the process is still alive.
      - name: Smoke-test the packaged app
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          data="$tmp/data"
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/config" \
            xvfb-run -a dist/desktop/linux-amd64/aurora --data-dir "$data" \
            >"$tmp/stdout" 2>"$tmp/stderr" &
          pid=$!
          for _ in $(seq 1 50); do
            if [[ -f "$data/aurora.db" ]]; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$tmp/stdout" "$tmp/stderr" >&2
              echo "the packaged app exited before creating its database" >&2
              exit 1
            fi
            sleep 0.2
          done
          test -f "$data/aurora.db"
          kill -0 "$pid"

      - uses: actions/upload-artifact@v7
        with:
          name: aurora-desktop-linux-amd64
          path: dist/desktop/linux-amd64
          retention-days: 5
