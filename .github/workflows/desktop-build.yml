name: Desktop Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}
      require_signed_macos:
        description: Fail unless every macOS signing secret is configured
        type: boolean
        default: false
      require_signed_windows:
        description: Fail unless every Windows signing secret is configured
        type: boolean
        default: false
    # The caller passes these with `secrets: inherit`. They stay optional
    # here so development calls can still produce an unsigned package, while
    # release.yml requires both signing contracts and refuses to publish one.
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
  # Keep a direct entry point for validating the native matrix without
  # creating a release. A manual run on main packages all five targets with
  # signing disabled unless the repository secrets are explicitly configured.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to package
        required: false
        type: string
        default: ''
      require_signed_macos:
        description: Fail unless every macOS signing secret is configured
        type: boolean
        default: false
      require_signed_windows:
        description: Fail unless every Windows signing secret is configured
        type: boolean
        default: false

env:
  NODE_VERSION: '22'

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-latest
            platform: linux/amd64
            artifact: aurora-desktop-linux-amd64
            path: dist/desktop/linux-amd64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: aurora-desktop-linux-arm64
            path: dist/desktop/linux-arm64
          - name: macOS arm64
            os: macos-latest
            platform: darwin/arm64
            artifact: aurora-desktop-darwin-arm64
            path: dist/desktop/darwin-arm64
          - name: macOS amd64
            os: macos-15-intel
            platform: darwin/amd64
            artifact: aurora-desktop-darwin-amd64
            path: dist/desktop/darwin-amd64
          - name: Windows amd64
            os: windows-latest
            platform: windows/amd64
            artifact: aurora-desktop-windows-amd64
            path: dist/desktop/windows-amd64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          # mygo.config.ts derives the package version with `git describe`.
          # A shallow checkout has no tags, so a release would be stamped
          # with a bare SHA instead of the tag.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      # mygo.config.ts is evaluated with Bun or Node.js. Pin Node 22 so the
      # TypeScript configuration works the same on every runner.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # MyGo loads GTK/WebKit at runtime, and the smoke test below starts the
      # real package. Installing the runtime before packaging makes a missing
      # library a clear failure here instead of a window that never appears on
      # a user's machine.
      - name: Install desktop runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-0 libgtk-3-0 xvfb

      # A macOS release that is only ad-hoc signed is not installable on
      # another Mac: Gatekeeper rejects it. Import the Developer ID and the
      # notary profile before packaging, and make the contract explicit so a
      # release can never silently publish that package.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          REQUIRE_SIGNED_MACOS: ${{ inputs.require_signed_macos }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          names=(
            MACOS_CERTIFICATE
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGNING_IDENTITY
            APPLE_ID
            APPLE_TEAM_ID
            APPLE_APP_PASSWORD
          )
          missing=()
          missing_count=0
          for name in "${names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
              ((missing_count += 1))
            fi
          done

          if (( missing_count == 0 )); then
            keychain="$RUNNER_TEMP/aurora-signing.keychain-db"
            notary_profile="aurora-notary"
            password="$(openssl rand -base64 24)"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/aurora-certificate.p12"
            security import "$RUNNER_TEMP/aurora-certificate.p12" -k "$keychain" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/aurora-certificate.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" login.keychain

            identity_out="$(security find-identity -v -p codesigning "$keychain")"
            if ! grep -Fq "\"$MACOS_SIGNING_IDENTITY\"" <<<"$identity_out"; then
              printf 'The imported certificate does not contain the requested signing identity: %s\n' "$MACOS_SIGNING_IDENTITY" >&2
              printf '%s\n' "$identity_out" >&2
              exit 1
            fi

            xcrun notarytool store-credentials "$notary_profile" --keychain "$keychain" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            {
              echo "MACOS_SIGNING=enabled"
              echo "MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY"
              echo "NOTARY_KEYCHAIN_PROFILE=$notary_profile"
              echo "NOTARY_KEYCHAIN=$keychain"
            } >> "$GITHUB_ENV"
            echo "macOS signing and notarization configured."
            exit 0
          fi

          if [[ "${REQUIRE_SIGNED_MACOS:-false}" == "true" ]]; then
            printf 'This release requires signed and notarized macOS packages, but these repository secrets are missing: %s\n' "${missing[*]}" >&2
            printf 'See docs/desktop.md "macOS 发布签名" for the exact secret contract.\n' >&2
            exit 1
          fi

          if (( missing_count < ${#names[@]} )); then
            printf 'macOS signing secrets are partially configured; set all of them or none: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          echo "MACOS_SIGNING=disabled" >> "$GITHUB_ENV"
          echo "macOS signing is not configured; the package is ad-hoc signed and is not releasable."

      # An unsigned installer makes SmartScreen warn on every download. The
      # certificate and its password stay optional for development builds,
      # while release.yml makes them mandatory before packaging.
      - name: Configure Windows signing
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-signing
        with:
          require_signed: ${{ inputs.require_signed_windows }}
          certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          certificate_password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # Storage is pure Go; keep packaging free of a native C toolchain.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '0'
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: go tool mygo build -platform ${{ matrix.platform }}
        working-directory: desktop

      - name: Package
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: '0'
        run: go tool mygo build -platform ${{ matrix.platform }}
        working-directory: desktop

      # A successful `mygo build` is not enough for a release: the installer
      # or disk image can be skipped when a platform tool is missing. Fail
      # before uploading a partial package.
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              test -x "${{ matrix.path }}/aurora"
              test -f "${{ matrix.path }}/aurora.desktop"
              test -f "${{ matrix.path }}/install.sh"
              test -f "${{ matrix.path }}/build-time.txt"
              test -n "$(find "${{ matrix.path }}" -maxdepth 1 -name '*.deb' -print -quit)"
              test -n "$(find "${{ matrix.path }}" -maxdepth 1 -name '*.tar.gz' -print -quit)"
              grep -q 'MimeType=x-scheme-handler/aurora;' "${{ matrix.path }}/aurora.desktop"
              test -z "$(find "${{ matrix.path }}" -name '*.go' -print -quit)"
              ;;
            macOS)
              app="${{ matrix.path }}/Aurora.app"
              test -d "$app"
              test -f "$app/Contents/Resources/build-time.txt"
              dmg="$(find "${{ matrix.path }}" -maxdepth 1 -name '*.dmg' -print -quit)"
              test -n "$dmg"
              test -z "$(find "$app" -name '*.go' -print -quit)"
              if [[ "${MACOS_SIGNING:-disabled}" == "enabled" ]]; then
                codesign --verify --deep --strict --verbose=2 "$app"
                codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application'
                spctl --assess --type execute --verbose=2 "$app"
                xcrun stapler validate "$app"
                xcrun stapler validate "$dmg"
              fi
              ;;
            Windows)
              test -f "${{ matrix.path }}/Aurora.exe"
              test -f "${{ matrix.path }}/build-time.txt"
              test -n "$(find "${{ matrix.path }}" -maxdepth 1 -name '*Setup*.exe' -print -quit)"
              test -z "$(find "${{ matrix.path }}" -name '*.go' -print -quit)"
              ;;
          esac

      # "test -x" cannot tell a package that dies before opening its window
      # from a working one: a missing WebKitGTK runtime or a broken embedded
      # UI passes every file check. Start the real artifact against its default
      # app directory and require the database, log and owner-only modes while
      # the process is alive, on both Linux architectures. `--version` is
      # checked from the same artifact, so the release cannot ship a 0.0.1
      # build stamp.
      - name: Smoke-test the packaged app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          app="${{ matrix.path }}/aurora"
          version="$("$app" --version)"
          printf '%s\n' "$version"
          test "$(printf '%s\n' "$version" | sed -n 's/^Version: //p')" != "0.0.1"
          build_time="$(printf '%s\n' "$version" | sed -n 's/^Build Time: //p')"
          test -n "$build_time"
          test "$build_time" != "unknown"

          tmp="$(mktemp -d)"
          data="$tmp/config/Aurora"
          pid=""
          cleanup() {
            if [[ -n "$pid" ]]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          umask 022
          HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/config" \
            xvfb-run -a "$app" \
            >"$tmp/stdout" 2>"$tmp/stderr" &
          pid=$!
          for _ in $(seq 1 50); do
            if [[ -f "$data/aurora.db" && -f "$data/logs/aurora.log" ]]; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$tmp/stdout" "$tmp/stderr" >&2
              echo "the packaged app exited before creating its state" >&2
              exit 1
            fi
            sleep 0.2
          done
          test -f "$data/aurora.db"
          test -f "$data/logs/aurora.log"
          test "$(stat -c '%a' "$data")" = "700"
          test "$(stat -c '%a' "$data/aurora.db")" = "600"
          test "$(stat -c '%a' "$data/logs/aurora.log")" = "600"
          kill -0 "$pid"

      # SmartScreen trusts the publisher only when the Authenticode signature
      # validates and is timestamped. Check both published executables rather
      # than assuming that `mygo build` signed them.
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REQUIRE_SIGNED_WINDOWS: ${{ inputs.require_signed_windows }}
        run: |
          if ($env:REQUIRE_SIGNED_WINDOWS -eq "true" -and $env:WINDOWS_SIGNING -ne "enabled") {
            Write-Error "This release requires Authenticode-signed Windows packages, but signing was not enabled."
            exit 1
          }
          if ($env:WINDOWS_SIGNING -ne "enabled") {
            Write-Host "Windows signing is not configured; skipping Authenticode verification for this development package."
            exit 0
          }

          $files = @()
          $files += Get-Item "${{ matrix.path }}/Aurora.exe" -ErrorAction Stop
          $files += @(Get-ChildItem "${{ matrix.path }}" -File -Filter "*Setup*.exe" -ErrorAction Stop)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne "Valid") {
              Write-Error "$($file.Name) has an invalid Authenticode signature: $($signature.StatusMessage)"
              exit 1
            }
            if ($null -eq $signature.SignerCertificate) {
              Write-Error "$($file.Name) has no signer certificate."
              exit 1
            }
            if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_SIGNING_SUBJECT) {
              Write-Error "$($file.Name) is signed by the wrong subject: $($signature.SignerCertificate.Subject)"
              exit 1
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_SIGNING_THUMBPRINT) {
              Write-Error "$($file.Name) is signed by the wrong certificate: $($signature.SignerCertificate.Thumbprint)"
              exit 1
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              Write-Error "$($file.Name) is signed without an RFC 3161 timestamp."
              exit 1
            }
            Write-Host "$($file.Name): valid Authenticode signature from $($signature.SignerCertificate.Subject)"
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          retention-days: 5
