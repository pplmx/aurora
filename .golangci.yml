version: "2"

linters:
  default: none
  # errcheck is deliberately absent: its findings here are stdout fmt.Fprint*
  # writes nobody can act on and test-only Close calls (the store's t.Cleanup),
  # so enabling it would trade real signal for noise. The gate's signal comes
  # from vet, staticcheck, ineffassign, unused, bodyclose, misspell, errorlint,
  # nilerr, durationcheck, rowserrcheck and sqlclosecheck.
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  exclusions:
    rules:
      # Test files legitimately assert on values the analyzer cannot prove
      # non-nil, and the repo's helpers make SA5011 noise instead of signal.
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA5011"
