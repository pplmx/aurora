<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery - Aurora</title>
    <script defer src="/vendor/alpine.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" data-module="lottery" x-data="lotteryApp()">
        <header>
            <h1>Aurora <span class="version">Lottery</span></h1>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/lottery.html" aria-current="page">Lottery</a>
                <a href="/voting.html">Voting</a>
                <a href="/token.html">Token</a>
                <a href="/oracle.html">Oracle</a>
                <a href="/blockchain.html">Blockchain</a>
                <a href="/nft.html">NFT</a>
            </nav>
        </header>
        <main>
            <section class="create-form">
                <h2>Create Lottery</h2>
                <form @submit.prevent="createLottery">
                    <div class="form-group">
                        <label for="lottery-participants">Participants (comma-separated)</label>
                        <input id="lottery-participants" type="text" x-model="participants" placeholder="A,B,C,D" required aria-invalid="false" aria-describedby="participants-error">
                        <span id="participants-error" role="alert" aria-live="assertive" class="error-message" x-show="participantsError" x-text="participantsError"></span>
                    </div>
                    <div class="form-group">
                        <label for="lottery-seed">Seed (required)</label>
                        <input id="lottery-seed" type="text" x-model="seed" placeholder="at least 3 characters" required minlength="3" aria-invalid="false" aria-describedby="seed-error">
                        <span id="seed-error" role="alert" aria-live="assertive" class="error-message" x-show="seedError" x-text="seedError"></span>
                    </div>
                    <div class="form-group">
                        <label for="lottery-count">Count</label>
                        <input id="lottery-count" type="number" x-model="count" min="1" step="1" value="1" required aria-describedby="lottery-count-h Lottery-count-error" :aria-invalid="!!countError">
                        <p id="lottery-count-hint" class="form-hint">How many winners to draw; must not exceed the participant count.</p>
                        <span id="count-error" role="alert" aria-live="assertive" class="error-message" x-show="countError" x-text="countError"></span>
                    </div>
                    <button type="submit" class="btn-lottery" :disabled="busy.createLottery || !!participantsError || !!seedError || !!countError">Create Lottery</button>
                    <div x-show="result && !result.includes('failed')" class="result success" aria-live="polite" x-text="result"></div>
                    <div x-show="result && result.includes('failed')" class="result error" aria-live="assertive" x-text="result"></div>
                <div x-show="result" class="result" aria-live="polite" x-text="result"></div>
            </section>
            <section class="history" id="verify">
                <h2>Lottery History</h2>
                <div x-show="loading">Loading...</div>
                <div class="table-scroll" role="region" aria-label="Lottery history" tabindex="0"
                     x-show="!loading && history.length > 0">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Participants</th>
                                <th scope="col">Winners</th>
                                <th scope="col">Created</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in history" :key="item.id">
                                <tr>
                                    <td x-text="item.id"></td>
                                    <td x-text="item.participants?.join(', ')"></td>
                                    <td x-text="item.winners?.join(', ')"></td>
                                    <td x-text="new Date(item.timestamp * 1000).toLocaleString()"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <p x-show="!loading && history.length === 0 && !historyFailed">No lotteries yet</p>
                <p x-show="!loading && history.length === 0 && historyFailed" class="hint">Failed to load history — check the API / refresh.</p>
            </section>
            <section class="history">
                <h2>Verify Draw</h2>
                    <div class="form-group">
                        <label for="lottery-verify-id">Lottery ID</label>
                        <input id="lottery-verify-id" type="text" x-model="verifyId" placeholder="Lottery ID" required aria-invalid="false" aria-describedby="verifyId-error">
                        <span id="verifyId-error" role="alert" aria-live="assertive" class="error-message" x-show="verifyIdError" x-text="verifyIdError"></span>
                    </div>
                    <button type="submit" class="btn-lottery" :disabled="busy.verifyDraw || !!verifyIdError">Verify Draw</button>
                </form>
                <pre x-show="verifyResult" class="result" aria-live="polite" x-text="verifyResult"></pre>
            </section>
        </main>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
