[server]
# Listen address for aurora-api. Precedence: flags (-H/--host, -p/--port), then
# AURORA_SERVER_HOST / AURORA_SERVER_PORT, then this file.
host = "0.0.0.0"
port = 8080

# level takes zerolog's names: debug, info, warn, error (the default), and the
# quieter fatal/panic. An unknown value logs a warning and falls back to info
# rather than silently changing the stream. path is the directory holding
# aurora.log, created with 0600 permissions.
[log]
level = "info"
path = "./logs/"

# [api] configures the REST server's own settings. The key is required in
# production: aurora-api reads AURORA_API_KEY first, then this section's key.
# Keep real keys in the environment or an untracked copy of this file.
[api]
# key = "change-me"

[db]
# SQLite is the only supported backend. path is the database file location;
# disk-backed file: URIs (including percent-escaped paths) are accepted. URI
# fragments are ignored by SQLite; encode a literal # in the filename as %23.
# Memory databases are for tests only and cannot be backed up.
path = "./data/aurora.db"

# The CLI applies the migrations under `path` before running a command when
# autoRun is true. The REST server and the window do not run them: their
# repositories create the tables they need when first opened. `aurora doctor`
# warns when the directory cannot be read.
[migrate]
autoRun = false
path = "./migrations"

[lottery]
# defaultCount is the winner count used when `lottery create` is run without
# -c/--count. The seed is never auto-generated: it is always supplied by the
# caller (CLI -s/--seed, REST request, or desktop form), so no
# defaultSeedPrefix exists.
defaultCount = 3

# [i18n] picks the language Aurora writes: "en", "zh" (Simplified) or
# "zh-Hant" (Traditional). The locale environment wins over this key
# (LC_ALL, LANGUAGE, LC_MESSAGES, then LANG); this is the fallback for a
# launcher or container that exports none of them. The desktop window follows
# the same rule.
[i18n]
locale = "en"

# The [http] and [http.rateLimit] sections govern the OUTBOUND oracle
# fetcher (HTTP timeout for reading a source; per-source pacing of
# fetches), not the API server. See [api.rateLimit] for the server's own
# per-client limiter.
[http]
timeout = "10s"

[http.rateLimit]
requests = 10
window = "1m"

# [api.rateLimit] governs the API server's INBOUND per-client request
# limiter (default disabled — the nuances are documented in
# internal/config/config.go). Enable it with:
[api.rateLimit]
# enabled = true
# requests = 120        # per-client budget inside `window`
# window = "1m"         # seconds; DurationSeconds, e.g. 60 == 60s
# trustedProxies = []   # CIDR/IPs whose X-Forwarded-For is honored

# [api.cors] configures the CORS allow-list for the REST API. Default is
# empty (= same-origin only); add origins to permit cross-origin browsers.
[api.cors]
# allowedOrigins = ["https://app.example.com"]

# [oracle.scheduler] tunes the oracle fetch scheduler's check cadence.
# Values are SECONDS (DurationSeconds): `checkInterval = 30` means every 30s.
[oracle.scheduler]
# checkInterval = 1

# Oracle Data Sources
#
# Oracle sources are NOT configured from this file: the binary never reads an
# [[oracle.sources]] table here, so editing one would silently have no effect.
# Sources live in the SQLite database and are managed at runtime via
#   aurora oracle source add ...   (or the REST API / desktop Oracle page).
# The only live oracle settings are [oracle.scheduler] (check cadence, optional);
# per-source interval is set on each source at add time.
